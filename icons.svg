      <path d="M11 6l1-1a4 4 0 0 1 5.7 5.7l-1.4 1.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M13 18l-1 1a4 4 0 0 1-5.7-5.7l1.4-1.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
