<!--
  Sprite de ícones genéricos (estilo Feather/Lucide), desenhado à mão para
  este preview. O monday.com usa sprite/fonte proprietária própria — não
  copiada aqui, ver re-monday/clone/barriers.md (clean room: silhueta
  equivalente, asset diferente).
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>
    <g id="icon-stroke-defaults" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></g>

    <symbol id="icon-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <line x1="21" y1="21" x2="16.1" y2="16.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>

    <symbol id="icon-chevron-down" viewBox="0 0 24 24">
      <polyline points="6 9 12 15 18 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <symbol id="icon-chevron-right" viewBox="0 0 24 24">
      <polyline points="9 6 15 12 9 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <symbol id="icon-bell" viewBox="0 0 24 24">
      <path d="M6 10a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M10 20a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>

    <symbol id="icon-inbox" viewBox="0 0 24 24">
