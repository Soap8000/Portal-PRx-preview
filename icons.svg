    </symbol>

    <symbol id="icon-dollar" viewBox="0 0 24 24">
      <line x1="12" y1="2" x2="12" y2="22" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M16.5 6.5c0-1.7-2-3-4.5-3s-4.5 1.2-4.5 3c0 4.2 9 2 9 6.2 0 1.8-2 3.3-4.5 3.3s-4.5-1.5-4.5-3.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>

    <symbol id="icon-target" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/>
    </symbol>

    <symbol id="icon-briefcase" viewBox="0 0 24 24">
      <rect x="3" y="8" width="18" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" fill="none" stroke="currentColor" stroke-width="1.7"/>
