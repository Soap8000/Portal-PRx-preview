      <circle cx="19" cy="12" r="1.6" fill="currentColor"/>
    </symbol>

    <symbol id="icon-building" viewBox="0 0 24 24">
      <rect x="5" y="3" width="10" height="18" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <line x1="8" y1="7" x2="8" y2="7.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="12" y1="7" x2="12" y2="7.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="8" y1="11" x2="8" y2="11.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="12" y1="11" x2="12" y2="11.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M15 21v-6h4v6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </symbol>

    <symbol id="icon-link" viewBox="0 0 24 24">
