    </symbol>

    <symbol id="icon-user-plus" viewBox="0 0 24 24">
      <circle cx="10" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M4 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="18" y1="7" x2="18" y2="13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="15" y1="10" x2="21" y2="10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
